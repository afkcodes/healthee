# Healthee — production compose stack (run on the VPS via infra/deploy.sh).
#
#   db   — TimescaleDB (Postgres 17 + timescaledb), data on a named volume,
#          internal-only (never published to the host).
#   api  — FastAPI app, bound to 127.0.0.1:8765 (nginx reverse-proxies to it).
#
# Env comes from infra/.env (see infra/.env.example). Validate config with:
#   docker compose --env-file .env.example -f docker-compose.prod.yml config -q
#
# Build context is the repo root so the Dockerfile can reach apps/server.

services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: healthee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - healthee-pgdata:/var/lib/postgresql/data
    # Internal-only — Postgres is never exposed to the host. The api service
    # reaches it by the service name 'db' on the compose network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - healthee-net

  api:
    build:
      # Repo root — the Dockerfile copies apps/server/*.
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    image: healthee-api:latest
    container_name: healthee-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB — service name 'db' resolves on the compose network.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      # The admin identity: needed in the container because `python -m
      # healthee.db.migrate` / `provision_app_role` / `claim_sentinel` are run
      # here via `compose exec`. It is NOT what the request pool connects as.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The least-privilege role the request pool uses (MULTI_USER.md §3.3).
      # Blank ⇒ the container REFUSES TO START, unless ALLOW_ADMIN_DB_FALLBACK asks
      # for the transitional admin-cred fallback (bootstrap step 1 only). Provision
      # the role BEFORE setting these (infra/.env.example, infra/DEPLOY.md B2).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      ALLOW_ADMIN_DB_FALLBACK: ${ALLOW_ADMIN_DB_FALLBACK:-false}
      # Supabase identity (MULTI_USER.md §4). The API only VERIFIES the JWT.
      # A blank secret fails auth CLOSED — every JWT is refused — so omitting
      # these here silently reduces the server to legacy-token-only.
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      SUPABASE_JWT_AUD: ${SUPABASE_JWT_AUD:-authenticated}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      # Signup gating (§4, §13 [D1]) — enforced by the server, not Supabase.
      # SIGNUP_ALLOWLIST is what makes owner onboarding possible (§4.4b), so it
      # must reach the container or the claim procedure cannot be run.
      SIGNUPS_OPEN: ${SIGNUPS_OPEN:-false}
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
      # MCP endpoint (docs/MCP.md): read-only, device-token authenticated.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      # Entitlement (§12). Premium is the `subscription` table; this flag is the
      # self-hosted deployment-wide override and must be false on the hosted box.
      SELF_HOST_UNLOCKED: ${SELF_HOST_UNLOCKED:-false}
      PREMIUM_COACH_QUESTIONS: ${PREMIUM_COACH_QUESTIONS:-20}
      UPGRADE_URL: ${UPGRADE_URL:-}
      # LLM. The model ids are REQUIRED whenever the key is set: a blank id is
      # forwarded to OpenRouter verbatim and comes back a 400. The API now REFUSES
      # TO START in that state (core/config) rather than serving a dead AI layer
      # behind a green /healthz.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      COACH_MODEL: ${COACH_MODEL:-}
      COACH_REASONING: ${COACH_REASONING:-on}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_DEADLINE_S: ${LLM_DEADLINE_S:-120}
      GATHERING_DEADLINE_S: ${GATHERING_DEADLINE_S:-150}
      # Read by /readyz's balance state. The ALERT on it is the scheduler's job;
      # this container only has to agree with it about where "low" starts.
      LLM_LOW_BALANCE_USD: ${LLM_LOW_BALANCE_USD:-20}
      LLM_VALIDATION_RETRIES: ${LLM_VALIDATION_RETRIES:-2}
      # Coach-tier provider preference; blank leaves OpenRouter's routing alone.
      # It reaches BOTH containers because the scheduler's `warm` step is coach-tier
      # too — routing configured in one and not the other would mean the same answer
      # came from different providers depending on which process asked for it.
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-}
      LLM_PROVIDER_SORT: ${LLM_PROVIDER_SORT:-throughput}
      API_HOST: 0.0.0.0
      API_PORT: 8765
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Telegram notifications (optional).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Public geodata caches, on the healthee-geocache volume below. The
      # elevation cache had NO volume and defaulted under /tmp, so every restart
      # re-downloaded the SRTM tiles this box had already fetched.
      SRTM_CACHE_DIR: ${SRTM_CACHE_DIR:-/var/cache/healthee/srtm}
      MAP_TILE_CACHE_DIR: ${MAP_TILE_CACHE_DIR:-/var/cache/healthee/tiles}
      MAP_TILE_CACHE_MB: ${MAP_TILE_CACHE_MB:-512}
      # Local embedding model for hybrid retrieval (Step 2a) — same geocache volume as
      # the caches above, so the ~69 MB ONNX file is fetched once and survives a
      # container recreation.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/var/cache/healthee/embeddings}
      # The coach's own evidence passage budget (Step 2b) — every other grounded
      # surface is unaffected and keeps embedding whole notes.
      EVIDENCE_TOKEN_BUDGET: ${EVIDENCE_TOKEN_BUDGET:-8000}
      EVIDENCE_RERANK: ${EVIDENCE_RERANK:-false}
      # The basemap this deployment proxies, and who it credits. The app talks
      # only to this container; repointing the url needs the attribution changed
      # with it (GET /api/map serves the pair).
      MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}
      MAP_TILE_MIN_ZOOM: ${MAP_TILE_MIN_ZOOM:-1}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-17}
    volumes:
      - healthee-geocache:/var/cache/healthee
    # Bind ONLY to localhost — nginx on the host reverse-proxies here. Never
    # expose 8765 publicly; auth is Bearer-token only.
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthee-net

  # ── scheduler (WP8) ────────────────────────────────────────────────────
  # Supervised in-process job runner: the self-rescheduling loop that fires the
  # correlate → recs → briefing chain steps on their daily IST timers. Same image
  # as the api, CMD overridden to the module entrypoint (NO subprocess/shell — the
  # steps are in-process supervised functions; standards §2, docs/ARCHITECTURE WP8).
  scheduler:
    image: healthee-api:latest
    container_name: healthee-scheduler
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "healthee.jobs.scheduler"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The scheduler is a job runner, not an admin: same least-privilege role as
      # the api (its nightly chain only reads/writes data tables).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      ALLOW_ADMIN_DB_FALLBACK: ${ALLOW_ADMIN_DB_FALLBACK:-false}
      # Grounded recs + briefing go through the LLM choke point; Telegram carries
      # the morning briefing and every supervised step failure. Blank key ⇒ no-op.
      # The model ids are REQUIRED whenever the key is set — this container IS the
      # nightly chain, so a blank id 400s every recs/briefing run. The scheduler
      # refuses to start in that state, same as the api (core/config).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      COACH_MODEL: ${COACH_MODEL:-}
      COACH_REASONING: ${COACH_REASONING:-on}
      # The tick loop is single-threaded, so ONE unbounded call blocks every later
      # owner's chain. These were in infra/.env.example but never passed through
      # here, which meant setting them in infra/.env did nothing and the SDK's
      # 600 s × 3 default applied to the container that can least afford it.
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_DEADLINE_S: ${LLM_DEADLINE_S:-120}
      GATHERING_DEADLINE_S: ${GATHERING_DEADLINE_S:-150}
      # This container is the one that ALERTS on the LLM layer (jobs/llm_watch.py):
      # it polls the free credits endpoint hourly and pushes a Telegram warning below
      # this balance, plus an outage alert on repeated transport failures. Without it
      # here, a dead AI layer stays exactly as invisible as it was on 2026-08-01.
      LLM_LOW_BALANCE_USD: ${LLM_LOW_BALANCE_USD:-20}
      # The nightly chain is where most generations happen, so the retry budget has
      # to reach it or the API and the scheduler would disagree about how many
      # chances an answer gets on the same box.
      LLM_VALIDATION_RETRIES: ${LLM_VALIDATION_RETRIES:-2}
      # Coach-tier provider preference; blank leaves OpenRouter's routing alone.
      # It reaches BOTH containers because the scheduler's `warm` step is coach-tier
      # too — routing configured in one and not the other would mean the same answer
      # came from different providers depending on which process asked for it.
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-}
      LLM_PROVIDER_SORT: ${LLM_PROVIDER_SORT:-throughput}
      # The chain skips the LLM steps for a non-premium owner (§12.3), so this
      # container decides entitlement too — and without the flag a SELF-HOSTED
      # install would serve its owner the AI layer over HTTP while the nightly
      # chain silently generated nothing for them.
      SELF_HOST_UNLOCKED: ${SELF_HOST_UNLOCKED:-false}
      PREMIUM_COACH_QUESTIONS: ${PREMIUM_COACH_QUESTIONS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # The nightly re-derive resolves terrain elevation for GPS tracks, so this
      # container reads and writes the SAME SRTM cache as the api. Sharing the
      # volume is the point: two caches would download every tile twice.
      SRTM_CACHE_DIR: ${SRTM_CACHE_DIR:-/var/cache/healthee/srtm}
      # The nightly chain's recs/briefing/coach-tool calls go through the same
      # retrieval ranker as the api, so this container needs the same embedding
      # cache — sharing the volume, not a second download dir.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/var/cache/healthee/embeddings}
      # The coach's own evidence passage budget (Step 2b) — not on this container's
      # own call path today, but the api and scheduler agree on every LLM-adjacent
      # setting so neither drifts if that changes.
      EVIDENCE_TOKEN_BUDGET: ${EVIDENCE_TOKEN_BUDGET:-8000}
      EVIDENCE_RERANK: ${EVIDENCE_RERANK:-false}
    volumes:
      - healthee-geocache:/var/cache/healthee
    networks:
      - healthee-net

volumes:
  healthee-pgdata:
  # Public geodata only — SRTM elevation tiles and basemap tiles this box has
  # fetched. Nothing in here is an owner's data, and losing it costs a
  # re-download rather than a measurement. It exists because NOT having it cost
  # that re-download on every single container restart.
  healthee-geocache:

networks:
  healthee-net:
    driver: bridge
