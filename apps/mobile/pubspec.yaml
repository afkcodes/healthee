name: healthee
description: "Healthee — an honest, self-hosted AI health companion."
# Never published to pub.dev.
publish_to: "none"

# The build number is set by CI at release time (--build-number), not bumped by hand.
version: 1.0.7+9

environment:
  sdk: ^3.12.0

# ─────────────────────────────────────────────────────────────────────────────
# Every version below was looked up on pub.dev at write time (2026-08-04) and
# then RESOLVED, never recalled from memory (Engineering Standards §1). Caret
# ranges throughout, so pub always takes the highest version that fits and
# dependabot's monthly bumps apply without edits here.
#
# ## The one constraint that shapes this whole file
#
# Flutter 3.44.7's bundled `flutter_test` pins `meta 1.18.0` and `test_api
# 0.7.11`. Those pins put a hard ceiling of **analyzer 12.x** on this package,
# and the whole code-generation stack hangs off the analyzer version. So the
# newest published version of several packages here is UNREACHABLE on this
# toolchain — not preferred-against, unreachable. Where that applies, the
# comment says which version was wanted, what blocks it, and what we took
# instead. Raising the Flutter SDK is what lifts these, and the carets mean
# that happens by itself.
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── state ────────────────────────────────────────────────────────────────
  # Riverpod WITH code generation: providers are compile-checked, so a mistyped
  # provider is a build failure rather than a runtime null (Standards §3 —
  # "State via Riverpod only … everything injectable via providers").
  #
  # 3.4.2 / 4.0.6 were wanted. The riverpod family is version-locked to its own
  # generator (riverpod_generator pins riverpod_annotation exactly, which pins
  # riverpod), and riverpod_generator >=4.0.6 needs analyzer ^13 — above the
  # ceiling. Code generation is the architectural decision; one minor version of
  # the runtime is not, so the runtime moved rather than the decision.
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # ── navigation ───────────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── data boundary ────────────────────────────────────────────────────────
  # ONE dio instance, exposed via a provider (data/api/api_client.dart).
  dio: ^5.11.0
  # json_serializable gives us the typed models Standards §3 requires at the
  # data boundary; feature code never touches a Map<String, dynamic>.
  #
  # freezed is DELIBERATELY ABSENT — see the README's "Dependency conflicts".
  # No STABLE freezed supports analyzer 12 (3.2.5 caps at 10; only the 3.2.6-dev
  # pre-release reaches 12), and pub will happily pick that pre-release if asked
  # with a loose constraint. A pre-release code generator underneath every model
  # in the app is not a foundation. What freezed would have contributed here is
  # copyWith/==/toString boilerplate — it is NOT what makes the honesty union
  # exhaustive. Dart 3's own `sealed class` is, and that is a language feature
  # no package can take away or hold back a version.
  json_annotation: ^4.12.0
  # `@immutable` on the models. Declared rather than leaned on transitively —
  # `depend_on_referenced_packages` is a build gate here.
  meta: ^1.18.0

  # ── local 60-day store ───────────────────────────────────────────────────
  # drift over raw sqflite: typed rows and compile-checked queries are the same
  # guarantee as the typed models above, one layer down. sqflite is deliberately
  # NOT a dependency — it would be a second way into the same database.
  drift: ^2.34.3
  # sqlite3 3.x ships the native library as a native asset on every platform,
  # including the host that `flutter test` runs on — which is what lets the
  # store's tests run against a real in-memory SQLite in CI. (Its old companion
  # sqlite3_flutter_libs is end-of-life as of 0.6.0+eol, which says exactly this.)
  sqlite3: ^3.5.0
  # Where the .sqlite file lives. Only data/store/connection.dart calls it.
  path_provider: ^2.1.6

  # ── credentials ──────────────────────────────────────────────────────────
  # The Zepp MAC + AUTHKEY and the API token live HERE, per account — never in a
  # dart-define. core/env.dart's docstring explains why that distinction is the
  # difference between a single-user app and a single-owner one.
  flutter_secure_storage: ^10.3.1

  # ── BLE strap protocol (lib/ble/, lands next) ────────────────────────────
  # Pinned now so the protocol PR starts from a resolved, current set instead of
  # re-deciding versions. Nothing imports them yet; the first ble/ commit does.
  # If that PR does not land, these come out with it (Standards §1, dead code).
  flutter_blue_plus: ^2.3.11
  pointycastle: ^4.0.0
  permission_handler: ^12.0.3

  # ── the app's own version, for the About row ─────────────────────────────
  # Reads the version this binary was actually built with. The alternative was a
  # constant in `core/env.dart`, which would be a SECOND definition of the number
  # in `pubspec.yaml` above — and the one that goes stale is the one on screen,
  # in the row whose whole job is to say which build the owner is running.
  # Resolved by `flutter pub add` at write time, not recalled.
  package_info_plus: ^10.2.1
  # Opens the release page in the browser when a newer build is published. The
  # app checks and TELLS; the download and the install are Android's own, which
  # is why this needs no `REQUEST_INSTALL_PACKAGES` — a permission that lets an
  # app install packages is a large thing to hold for a courtesy check.
  url_launcher: ^6.3.2

  # ── the legacy design, ported ────────────────────────────────────────────
  # Added 2026-08-05, when the owner made the legacy app the design
  # specification. All three are packages LEGACY depends on; they are here
  # because the design does, not because they were preferred.
  #
  # Versions resolved at write time via `flutter pub add`, never recalled.
  #
  # The continuous-corner squircle every card, sheet and badge is drawn with
  # (`core/theme/shapes.dart`). Flutter's own `RoundedSuperellipseBorder` is
  # very close and was the incumbent; this is what legacy actually drew
  # against, at smoothness 0.6, so it is what ships. One definition of the
  # corner, and `StateCard.shapeOf` delegates to it.
  smooth_corner: ^1.1.1
  # The skeletons' shimmer, at legacy's own 1300 ms / 250 ms / 22% highlight
  # (`shared/skeletons/`). NOTE for anyone testing a widget that uses it: its
  # `dispose` does not cancel the `Future.delayed` it schedules, so a test that
  # pumps one frame and ends fails on "pending timers" — `skeletons_test.dart`
  # pumps past the delay and says so.
  flutter_animate: ^4.5.2
  # Legacy's icon set. In use so far by `HDeltaBadge`'s arrows; the 25 screens
  # still to port name it throughout. If those land on Material icons instead,
  # this comes out with the last usage (Standards §1, dead code).
  solar_icons: ^0.1.0
  geolocator: ^14.0.3
  workmanager: ^0.10.9
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.5

  crypto: any
  gotrue: ^2.27.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── codegen ──────────────────────────────────────────────────────────────
  # 2.16.0 was wanted; build_runner >=2.15.2 needs analyzer >=13.3.0, which needs
  # meta ^1.18.3 against the SDK's pinned 1.18.0. Resolves to 2.15.1.
  build_runner: ^2.14.0
  json_serializable: ^6.14.1
  # 4.0.8 was wanted — analyzer ^13. See the riverpod note above.
  riverpod_generator: ^4.0.4
  # 2.34.5 was wanted; drift_dev >=2.34.1+1 needs analyzer ^13. 2.34.0 is the
  # newest under the ceiling and is still the same minor as the drift runtime
  # above, which is what actually matters: generated code targets that API.
  drift_dev: ^2.34.0

  # ── lints ────────────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  # Lets test/ble/strap_scan_test.dart put a fake radio under flutter_blue_plus.
  flutter_blue_plus_platform_interface: ^9.0.3
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.4
  # Neither custom_lint nor riverpod_lint is here, and that is a reported
  # deviation from the brief rather than an omission.
  #
  # riverpod_lint 3.1.4 moved off custom_lint onto the analyzer's own plugin
  # protocol, so the two can no longer resolve together: riverpod_lint >=3.1.4
  # needs analyzer_plugin ^0.14.0, custom_lint 0.8.1 needs ^0.13.0. custom_lint
  # alone would be a host with no guest.
  #
  # The successor path (a `plugins:` block in analysis_options.yaml) was tried and
  # measured, and does not work on Flutter 3.44.7 — `flutter analyze` silently
  # reports nothing from it and `dart analyze` hangs. analysis_options.yaml
  # documents the experiment and how to re-check it after an SDK bump.

# ── the launcher icon ───────────────────────────────────────────────────────
# Ported from the legacy app, which is where this mark was made: a lowercase `h`
# whose bowl resolves into a heart, green→teal, on near-black. The DARK logo, on
# purpose — it is the one that survives both launcher themes, because the ground
# it sits on is part of the artwork rather than something the launcher supplies.
#
# `adaptive_icon_background` is the same near-black as the artwork's own ground
# (`#0c0b0e`), so the Android 8+ mask cuts the shape out of one continuous
# colour rather than revealing a seam where the square ends.
#
# ⚠ Regenerating is a MANUAL step, not part of the build: `dart run
# flutter_launcher_icons` rewrites `android/app/src/main/res/mipmap-*` and those
# files are committed. Run it only when the artwork changes.
flutter_launcher_icons:
  android: true
  # iOS needs a 1024 square with no alpha and no rounded corners, and there is
  # no iOS build of this app yet. Turning it on would generate an asset catalogue
  # nothing consumes.
  ios: false
  image_path: "assets/icon/healthee.png"
  adaptive_icon_background: "#0c0b0e"
  adaptive_icon_foreground: "assets/icon/healthee.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # The font licence, BUNDLED. It sat beside the .ttf files and was not an asset,
  # so it shipped in the repo and not in the app — and the SIL OFL requires the
  # notice to travel with the fonts, which means inside the binary an owner
  # installs. `core/licences.dart` registers it with `LicenseRegistry` and the
  # About row on Settings is where it is read.
  assets:
    - assets/fonts/OFL-Figtree.txt
    - assets/fonts/OFL-Inter.txt

  # Figtree, vendored rather than fetched — no CDN at paint time, and a
  # cold-start budget of 2 s to first meaningful paint (Standards §1). SIL OFL
  # (no Reserved Font Name); the licence ships beside the files in
  # assets/fonts/OFL-Inter.txt. ~1.1 MB total.
  #
  # ONE file: Figtree is a VARIABLE font and the wght axis is driven directly
  # (see `_style` in core/theme/typography.dart), so four static instances are
  # not shipped. Inter rides alongside as HealtheeSymbols purely to cover the
  # characters Figtree lacks.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf

    # The glyph safety net, and it is BUNDLED on purpose. Figtree has no U+2194;
    # naming a platform symbol face in fontFamilyFallback does NOT stop Android
    # reaching for NotoColorEmoji — measured on the device, twice. A bundled
    # family does. See core/theme/typography.dart.
    - family: HealtheeSymbols
      fonts:
        - asset: assets/fonts/InterFallback.ttf
