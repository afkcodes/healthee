[project]
name = "healthee"
version = "0.1.0"
description = "Healthee server — honest, grounded health intelligence over Helio Strap data"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "psycopg-pool>=3.3.1",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "openai>=2.45.0",
    "pyjwt[crypto]>=2.13.0",
    # Local passage/question embeddings for hybrid retrieval (insights/embedding_index.py).
    # ONNX Runtime, NOT torch — verified on PyPI 2026-09-14 (fastembed's own requires_dist
    # has no torch anywhere; the eval group's sentence-transformers pull above is the one
    # torch dependency in this project, and it must stay opt-in only).
    "fastembed>=0.8.0",
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthee"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
    "pyright>=1.1.390",
    "pyyaml>=6.0.3",
]
# The grounding eval's SUPPORT (entailment) scorer only — a local cross-encoder NLI
# model, which pulls torch. NOT a default group: CI's `uv sync --frozen` must never
# download it (tests/grounding_eval/support.py imports it lazily for the same reason).
# `uv sync --group eval` from apps/server to run the real scorer or its opt-in smoke test.
eval = [
    "sentence-transformers>=6.0.1",
]

# ── Ruff — exactly per Engineering Standards §2 ──────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E,W (pycodestyle) · F (pyflakes) · I (isort) · N (pep8-naming) ·
# UP (pyupgrade) · B (bugbear) · SIM (simplify) · ARG (unused args) ·
# C90 (mccabe complexity).
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ARG", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy, fixture-arg patterns freely.
"tests/**" = ["ARG"]

# ── Pyright — static type checking (Addendum §G) ─────────────────────────
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# ── Pytest + coverage (reporting only — no fail-under until Phase 1) ──────
[tool.pytest.ini_options]
testpaths = ["tests"]
# apps/server on sys.path so the contract bed's `tests.contracts.*` helper modules
# (seed / endpoints / shape) import as a package across test files.
pythonpath = ["."]
addopts = "--cov=healthee --cov-report=term"
markers = [
    "integration: requires a reachable TimescaleDB; auto-skips when the DB env is unset/unreachable (runs in CI).",
]
