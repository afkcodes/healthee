name: CI

on:
  push:
    branches:
      - main
      - "phase-*/**"
      - "feat/**"
      - "fix/**"
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Repo-wide file-length gate (Engineering Standards §1) ──────────────
  gates:
    name: File-length gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check file lengths (repo-wide)
        run: python3 scripts/check_file_length.py

  # ── Server: lint, format, types, tests ─────────────────────────────────
  server:
    name: Server (ruff · pyright · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    # TimescaleDB for the integration tests (same image as prod). Unit tests
    # don't need it; the `integration`-marked tests connect here.
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: healthee
          POSTGRES_PASSWORD: healthee
          POSTGRES_DB: healthee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthee -d healthee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Without a pin uv picks the newest CPython, and a release can land before
          # its wheels do (3.15 had no onnxruntime wheel). Match the server image.
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Pyright type check
        run: uv run pyright
      - name: Pytest (with coverage report)
        # POSTGRES_* point at the service container so integration tests run
        # here (they auto-skip locally when the DB env is unreachable).
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: healthee
          POSTGRES_USER: healthee
          POSTGRES_PASSWORD: healthee
          REALTIME_INGEST_TOKEN: ci-test-token
        run: uv run pytest

  # ── Zepp importer: a standard-library tool, tested where it has to run ──
  # `scripts/zepp_import` must work on a bare server or a phone terminal with
  # nothing installed, so there is no dependency step: the tests run on the
  # oldest Python it supports and on the newest. Its tests READ the server
  # source to catch drift in the constants it copies (sport names, limits, the
  # upsert's COALESCE), which is why this checks out the whole repo.
  # Ruff and pyright are the server's pinned versions, read from its lockfile,
  # so the two halves of the repo cannot disagree about formatting.
  zepp-import:
    name: Zepp importer (unittest · ruff · pyright)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (no dependencies)
        run: python3 -m unittest discover -s scripts/zepp_import/tests -t scripts
      - name: The launcher starts
        run: python3 scripts/zepp-import --version
      - name: Install uv
        if: matrix.python-version == '3.13'
        uses: astral-sh/setup-uv@v7
      - name: Ruff and pyright at the server's pinned versions
        if: matrix.python-version == '3.13'
        run: |
          pinned() { awk -v name="$1" '$0 == "name = \"" name "\"" { getline; gsub(/[^0-9.]/, ""); print; exit }' apps/server/uv.lock; }
          uvx "ruff==$(pinned ruff)" check scripts/zepp_import
          uvx "ruff==$(pinned ruff)" format --check scripts/zepp_import
          uvx "pyright==$(pinned pyright)" -p scripts/zepp_import

  # ── Image: build the server Docker image and smoke-test it ─────────────
  # Closes the cutover gap where every test passed from source but the built
  # image crash-looped — the manifest resolved via a dev-only path and
  # packages/knowledge wasn't COPYied in. Two smoke tests prove the image
  # itself is sound: the corpus resolves INSIDE it (DB-free), and it boots
  # and serves /healthz against a real DB.
  image:
    name: Image (build · smoke)
    runs-on: ubuntu-latest
    # TimescaleDB for the boot smoke test — /healthz hard-requires the DB
    # (returns 503 without it), same image + creds as the `server` job.
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: healthee
          POSTGRES_PASSWORD: healthee
          POSTGRES_DB: healthee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthee -d healthee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # BuildKit builder — the Dockerfile uses `--mount=type=cache` mounts.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      # Context is the REPO ROOT (the Dockerfile COPYies apps/server + packages).
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.server
          load: true
          push: false
          tags: healthee-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke A — the exact cutover regression, DB-free: proves
      # HEALTHEE_KNOWLEDGE_DIR resolves and the corpus is present INSIDE the
      # built image (not merely in the source tree the other jobs run from).
      - name: Smoke A — manifest resolves in the image
        run: |
          docker run --rm healthee-server:ci python -c \
            "from healthee.insights import manifest; ids = manifest.note_ids(); assert len(ids) >= 60, ids; print('manifest OK:', len(ids))"
      # Smoke B — boot the image against the DB and poll /healthz until 200.
      #
      # `ALLOW_ADMIN_DB_FALLBACK=true` is REQUIRED and is not a workaround: the
      # settings guard refuses to boot when `POSTGRES_APP_*` are blank, because a
      # pool on the admin role bypasses RLS. This smoke test has no app role and no
      # data to isolate — it asks "does the built image start and serve /healthz" —
      # so it takes the guard's own documented escape hatch and says so explicitly.
      # Without it the container exited on a `ValidationError` and this job had been
      # red since the guard landed, with the poll loop reporting a connection
      # refusal that named neither the cause nor the fix.
      #
      # ⛔ Never set this in a deployment. `infra/DEPLOY.md` B2 owns the one real
      # use: the two-deploy bootstrap, where the role does not exist yet.
      - name: Smoke B — boot + /healthz
        run: |
          docker run -d --name healthee-smoke --network host \
            -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=healthee -e POSTGRES_USER=healthee -e POSTGRES_PASSWORD=healthee \
            -e ALLOW_ADMIN_DB_FALLBACK=true \
            healthee-server:ci
          echo "polling http://localhost:8765/healthz (up to 40s)…"
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8765/healthz; then
              echo; echo "healthz OK after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz never returned 200 — dumping container logs"
          docker logs healthee-smoke
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm -f healthee-smoke || true

  # ── Knowledge: manifest is regenerable and not hand-edited ─────────────
  knowledge:
    name: Knowledge (manifest freshness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Without a pin uv picks the newest CPython, and a release can land before
          # its wheels do (3.15 had no onnxruntime wheel). Match the server image.
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Regenerate manifest in check mode (fails on drift)
        run: uv run python ../../packages/knowledge/tools/gen_manifest.py --check
      - name: Embedding index artifact is current (Step 2a — hash-only, no model download)
        env:
          POSTGRES_PASSWORD: ci-check
          ALLOW_ADMIN_DB_FALLBACK: "true"
        run: uv run python -m healthee.insights.embedding_index --check

  # ── Secret scanning (Addendum §H) ──────────────────────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the pinned binary directly over the FULL history every time.
      # (gitleaks-action@v2 computes a commit range from the push event and
      # chokes on root-commit ranges — first push / new branches.)
      - name: Run gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --no-banner --redact --verbose

  # ── Mobile: only runs when apps/mobile exists (Phase 2) ────────────────
  mobile:
    name: Mobile (flutter analyze · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Flutter app
        id: detect
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile/pubspec.yaml not found — skipping mobile job (arrives in Phase 2)."
          fi
      - name: Set up Flutter
        if: steps.detect.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          # PINNED, not floating `stable`. The app's whole dependency set is
          # decided by the SDK: flutter_test pins `meta` and `test_api`, and
          # those pins cap the analyzer version, which caps build_runner,
          # riverpod_generator, drift_dev and freezed (apps/mobile/README.md
          # §"Dependency conflicts" has the table). On a floating channel a
          # Flutter release would silently re-resolve the toolchain under CI and
          # break a build nobody touched. Bump this deliberately, with the lock.
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Pub get
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze (zero warnings)
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/mobile
        run: flutter analyze --fatal-warnings --fatal-infos
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/mobile
        run: flutter test
