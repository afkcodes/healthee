# The server's lint rules (docs/ENGINEERING_STANDARDS.md), applied to a tool that also has
# to run on the Python a bare Ubuntu LTS or a phone terminal ships. The oldest of those is
# 3.10, on Ubuntu 22.04. Without this file ruff would find no config for scripts/ and
# fall back to its defaults.
extend = "../../apps/server/pyproject.toml"
target-version = "py310"
src = [".."]

[lint.per-file-ignores]
"tests/**" = ["ARG"]
